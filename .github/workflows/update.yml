name: Update Charts

on:
  schedule:
    - cron: '0 4 * * *'  # 12pm CST (UTC+8)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Chrome and xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable xvfb

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Scrape checkee.info and generate charts
        run: xvfb-run -a python generate.py --ci

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "chore: update charts $(date -u +%Y-%m-%d)"
          git push
